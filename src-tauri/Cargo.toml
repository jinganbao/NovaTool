[package]
name = "NovaTool"
version = "1.0.6"
description = "程序员常用开发工具箱"
authors = ["Sunshine"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nova_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["net", "sync", "macros", "io-util"] }
